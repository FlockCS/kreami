name: Migrate database

# The schema's only path to production. Never apply migrations by hand in the
# dashboard — a schema that exists only in a web UI is a schema you will lose.
# See docs/03-architecture.md.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_ID }}"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Push migrations
        run: supabase db push
