name: Deploy web

# Cloudflare Pages, not Vercel: Vercel's Hobby tier prohibits commercial use,
# which would bite the moment Kreami earns anything. See docs/03-architecture.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static web export
        # EXPO_PUBLIC_* values are inlined into the bundle at build time, so
        # they must be present here. Both are public by design; RLS is what
        # protects the data. See docs/09-security-moderation.md.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Move bundled assets out of a node_modules path
        # Cloudflare Pages refuses to upload anything under a directory named
        # node_modules — deliberately, on the assumption those are build-time
        # dependencies (cloudflare/workers-sdk#3615). Expo emits bundled assets
        # to dist/assets/node_modules/<package>/... because it mirrors the
        # source path, so all four fonts were silently dropped from every
        # deploy: the requests fell through to the SPA shell, useFonts got an
        # error instead of a font, and the site rendered in system fallbacks.
        #
        # Nothing warns about this. The upload succeeds, the deploy is green,
        # and the only symptom is that the typography is wrong.
        run: |
          set -euo pipefail
          if [ ! -d dist/assets/node_modules ]; then
            echo "No dist/assets/node_modules — Expo's layout changed, check this step."
            exit 0
          fi

          mv dist/assets/node_modules dist/assets/vendor

          # Rewrite the references. They are plain strings in the emitted HTML
          # and JS, so a literal replacement is exact — and restricted to text
          # output, because the same bytes could occur inside a font file.
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.css' -o -name '*.map' \) \
            -exec sed -i 's#assets/node_modules#assets/vendor#g' {} +

          # `|| true` on both: grep exits 1 when it matches nothing, and under
          # `set -euo pipefail` that is a failed build. For the second grep,
          # matching nothing is the outcome we want — so without this the step
          # fails precisely when it has succeeded, which is what happened the
          # first time this ran.
          rewrote=$({ grep -rl 'assets/vendor' dist --include='*.html' --include='*.js' || true; } | wc -l)
          remaining=$({ grep -rl 'assets/node_modules' dist --include='*.html' --include='*.js' || true; } | wc -l)

          echo "Rewrote $rewrote file(s); $remaining still reference the old path."
          # Numeric comparison, not string: wc pads with spaces on BSD and not
          # on GNU, so "0" and "       0" are both possible and only one of
          # them is equal to "0".
          if [ "$remaining" -ne 0 ]; then
            echo "Refusing to deploy a half-rewritten site."; exit 1
          fi
          if [ "$rewrote" -eq 0 ]; then
            echo "Nothing referenced assets/vendor after the move — check this step."; exit 1
          fi

      - name: Give the Pages Functions their Supabase config
        # The OpenGraph functions run at the edge and need to read from
        # Supabase. Both values are public — the anon key already ships inside
        # the client bundle, and RLS is what protects the data — but they are
        # written here from the same secrets the build uses rather than
        # committed, so there is one source of truth and rotating a key does
        # not mean remembering a second place.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cat > functions/_config.js <<EOF
          export const SUPABASE_URL = '${EXPO_PUBLIC_SUPABASE_URL}';
          export const SUPABASE_ANON_KEY = '${EXPO_PUBLIC_SUPABASE_ANON_KEY}';
          EOF
          node --check functions/_config.js && echo "config written and parses"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kreami --branch=main
